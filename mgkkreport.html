function toggleGrafik(cb){
    if(cb.value=="all" && cb.checked){
        document
        .querySelectorAll(
            '.toolbar input[type=checkbox]'
        )
        .forEach(x=>{

let barChartObj = null;
let pieJenisObj = null;
let pieStatusObj = null;

function buatGrafik(){

    // Hapus chart lama
    if(barChartObj) barChartObj.destroy();
    if(pieJenisObj) pieJenisObj.destroy();
    if(pieStatusObj) pieStatusObj.destroy();
    const unitData = {};
    const jenisData = {
        S:0,
        T:0,
        M:0,
        G:0,
        P:0
    };
    allData.forEach(item=>{
        const unit = item.unit || "-";
        const progres = (item.progres || "").toUpperCase();
        if(!unitData[unit]){
            unitData[unit] = {
                S:0,
                T:0,
                M:0,
                G:0,
                P:0
            };
        }
        if(unitData[unit][progres] !== undefined){
            unitData[unit][progres]++;
            jenisData[progres]++;
        }
    });

    // Urutkan berdasarkan total data terbesar

    const sortedUnits =
        Object.entries(unitData)
        .sort((a,b)=>{
            const totalA =
                a[1].S +
                a[1].T +
                a[1].M +
                a[1].G +
                a[1].P;
            const totalB =
                b[1].S +
                b[1].T +
                b[1].M +
                b[1].G +
                b[1].P;
            return totalB - totalA;
        });
    const labels = sortedUnits.map(x=>x[0]);
    const dataS = sortedUnits.map(x=>x[1].S);
    const dataT = sortedUnits.map(x=>x[1].T);
    const dataM = sortedUnits.map(x=>x[1].M);
    const dataG = sortedUnits.map(x=>x[1].G);
    const dataP = sortedUnits.map(x=>x[1].P);

    // =====================================
    // BAR CHART
    // =====================================

    barChartObj = new Chart(
        document.getElementById("barChart"),
        {
            type:"bar",
            data:{
                labels:labels,
            datasets:[
                {
                    label:"SSI",
                    data:dataS,
                    backgroundColor:"#fbc02d",
                    borderColor:"#fbc02d",
                    options:{
                        responsive:true,
                        maintainAspectRatio:false,
                        datasets:{
                            bar:{
                                barPercentage:0.8,
                                categoryPercentage:0.7
                            }
                        }
                    },
                    plugins:[ChartDataLabels]
                },
                {
                    label:"TPL",
                    data:dataT,
                    backgroundColor:"#43a047",
                    borderColor:"#43a047",
                    options:{
                        responsive:true,
                        maintainAspectRatio:false,
                        datasets:{
                            bar:{
                                barPercentage:0.8,
                                categoryPercentage:0.7
                            }
                        }
                    },
                    plugins:[ChartDataLabels]
                },
                {
                    label:"GKM",
                    data:dataM,
                    backgroundColor:"#1e88e5",
                    borderColor:"#1e88e5",
                    options:{
                        responsive:true,
                        maintainAspectRatio:false,
                        datasets:{
                            bar:{
                                barPercentage:0.8,
                                categoryPercentage:0.7
                            }
                        }
                    },
                    plugins:[ChartDataLabels]
                },
                {
                    label:"GKP",
                    data:dataG,
                    backgroundColor:"#8e24aa",
                    borderColor:"#8e24aa",
                    options:{
                        responsive:true,
                        maintainAspectRatio:false,
                        datasets:{
                            bar:{
                                barPercentage:0.8,
                                categoryPercentage:0.7
                            }
                        }
                    },
                    plugins:[ChartDataLabels]
                },
                {
                    label:"Selesai",
                    data:dataP,
                    backgroundColor:"#e53935",
                    borderColor:"#e53935",
                    options:{
                        responsive:true,
                        maintainAspectRatio:false,
                        datasets:{
                            bar:{
                                barPercentage:0.8,
                                categoryPercentage:0.7
                            }
                        }
                    },
                    plugins:[ChartDataLabels]
                }
            ]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                layout:{
                    padding:{
                        top:10,
                        bottom:30,
                        left:10,
                        right:10
                    }
                },
                plugins:{
                    title:{
                        display:true,
                        text:"GRAFIK PROGRES MGKK PER UNIT",
                        font:{size:18,weight:"bold"},
                        color:"#1565c0"
                    },
                    legend:{
                        position:"bottom"
                    },
                    datalabels:{
                        anchor:"end",
                        align:"top",
                        color:"#000",
                        font:{weight:"bold",size:11},
                        formatter:function(value){return value > 0 ? value : "";
                        }
                    }
                },
                scales:{
                    x:{
                        stacked:false,
                        ticks:{
                            maxRotation:45,
                            minRotation:45,
                            font:{
                                size:10
                            }
                        }
                    },
                    y:{
                        stacked:false,
                        beginAtZero:true,
                        grace:'20%'
                    }
                }
            }
        }
    );

    // =====================================
    // PIE CHART KOMPOSISI MGKK
    // =====================================

    pieJenisObj = new Chart(
        document.getElementById("pieTemuan"),
        {
            type:"pie",
            data:{
                labels:[
                    "SSI",
                    "TPL",
                    "GKM",
                    "GKP"
                ],
                datasets:[{
                    data:[
                        jenisData.S,
                        jenisData.T,
                        jenisData.M,
                        jenisData.G
                    ],
                    backgroundColor:[
                        "#1E88E5",
                        "#FB8C00",
                        "#43A047",
                        "#8E24AA"
                    ]
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                plugins:{
                    title:{
                        display:true,
                        text:"KOMPOSISI MGKK",
                        font:{
                            size:18,
                            weight:"bold"
                        },
                        color:"#1565c0"
                    },
                    legend:{
                        position:"bottom"
                    }
                }
            }
        }
    );

    // =====================================
    // PIE CHART STATUS PENYELESAIAN
    // =====================================

    const belumSelesai =
        jenisData.S +
        jenisData.T +
        jenisData.M +
        jenisData.G;
    pieStatusObj = new Chart(
        document.getElementById("piePerbaikan"),
        {
            type:"pie",
            data:{
                labels:[
                    "Belum Selesai",
                    "Selesai"
                ],
                datasets:[{

                    backgroundColor:[
                        "#FB8C00",
                        "#43A047"
                    ]
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                plugins:{
                    title:{
                        display:true,
                        text:"STATUS PROGRES",
                        font:{
                            size:18,
                            weight:"bold"
                        },
                        color:"#1565c0"
                    },
                    legend:{
                        position:"bottom"
                    }
                }
            }
        }
    );

    // =====================================
    // LEGENDA
    // =====================================

    document.getElementById(
        "legendContainer"
    ).innerHTML = `
        <div style="display:inline-block;margin:4px 10px;">
            <b>S</b> = SSI
        </div>
        <div style="display:inline-block;margin:4px 10px;">
            <b>T</b> = TPL
        </div>
        <div style="display:inline-block;margin:4px 10px;">
            <b>M</b> = GKM
        </div>
        <div style="display:inline-block;margin:4px 10px;">
            <b>G</b> = GKP
        </div>
        <div style="display:inline-block;margin:4px 10px;">
            <b>P</b> = Selesai
        </div>
    `;
}

function tambahDataset(
    datasets,
    label,
    field
){
    datasets.push({
        label:label,
        data:
            allData.map(x=>
                parseFloat(
                    x[field]
                    .toString()
                    .replace(/\./g,"")
                    .replace(",",".")
                ) || 0
            )
    });
}

async function downloadDashboardMGKKPDF(){
    const { jsPDF } = window.jspdf;
    const dashboard =
        document.querySelector(
            ".dashboard-content"
        );
    const btn =
        dashboard.querySelector(
            ".download-dashboard-btn"
        );
    const closeBtn =
        dashboard.querySelector(
            ".close"
        );
    const header =
        document.getElementById(
            "pdfHeader"
        );
    // sembunyikan tombol
    btn.style.display = "none";
    closeBtn.style.display = "none";

    // tampilkan header pdf
    header.style.display = "flex";

    // ubah height auto supaya semua isi masuk
    const oldHeight =
        dashboard.style.height;
    dashboard.style.height = "auto";

    // tunggu render
    await new Promise(r =>
        setTimeout(r, 500)
    );

    // capture full dashboard
    const canvas =
        await html2canvas(
            dashboard,
            {
                scale:2,
                useCORS:true,
                backgroundColor:"#ffffff",
                windowWidth:
                    dashboard.scrollWidth,
                windowHeight:
                    dashboard.scrollHeight
            }
        );
    const imgData =
        canvas.toDataURL(
            "image/png"
        );

    // buat pdf landscape
    const pdf =
        new jsPDF({
            orientation:"landscape",
            unit:"mm",
            format:"a4"
        });

    // ukuran halaman
    const pageWidth =
        pdf.internal.pageSize.getWidth();
    const pageHeight =
        pdf.internal.pageSize.getHeight();

    // margin
    const margin = 5;
    const availableWidth =
        pageWidth - (margin * 2);
    const availableHeight =
        pageHeight - (margin * 2);

    // scaling proporsional
    const ratio =
        Math.min(
            availableWidth / canvas.width,
            availableHeight / canvas.height
        );
    const finalWidth =
        canvas.width * ratio;
    const finalHeight =
        canvas.height * ratio;

    // posisi center
    const x =
        (pageWidth - finalWidth) / 2;
    const y =
        (pageHeight - finalHeight) / 2;

    // gambar
    pdf.addImage(
        imgData,
        "PNG",
        x,
        y,
        finalWidth,
        finalHeight
    );

    // save
    pdf.save(
        "Dashboard_MGKK.pdf"
    );

    // restore
    dashboard.style.height =
        oldHeight;
    header.style.display = "none";
    btn.style.display = "block";
    closeBtn.style.display = "block";
}


async function downloadDashboardPDF(){
    const { jsPDF } = window.jspdf;
    const dashboard =
        document.querySelector(".dashboard-content");
    const btn =
        dashboard.querySelector(
        ".download-dashboard-btn"
        );
        btn.style.display = "none";
    const closeBtn =
        dashboard.querySelector(
            ".close"
        );
        closeBtn.style.display = "none";
    // capture dashboard
    dashboard.style.height = "auto";
    const canvas =
        await html2canvas(dashboard, {
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff",
            windowWidth: dashboard.scrollWidth,
            windowHeight: dashboard.scrollHeight
        });
    const imgData =
        canvas.toDataURL("image/png");
    // ukuran canvas
    const imgWidth = canvas.width;
    const imgHeight = canvas.height;
    // buat PDF landscape
    const pdf =
        new jsPDF({
            orientation:"landscape",
            unit:"mm",
            format:"a4"
        });
    // ukuran halaman pdf
    const pageWidth =
        pdf.internal.pageSize.getWidth();
    const pageHeight =
        pdf.internal.pageSize.getHeight();
    // margin
    const margin = 5;
    // area tersedia
    const availableWidth =
        pageWidth - (margin * 2);
    const availableHeight =
        pageHeight - (margin * 2);
    // hitung rasio
    const ratio =
        Math.min(
            availableWidth / imgWidth,
            availableHeight / imgHeight
        );
    // ukuran final
    const finalWidth =
        imgWidth * ratio;
    const finalHeight =
        imgHeight * ratio;
    // posisi center
    const x =
        (pageWidth - finalWidth) / 2;
    const y =
        (pageHeight - finalHeight) / 2;
    // masukkan gambar
    pdf.addImage(
        imgData,
        "PNG",
        x,
        y,
        finalWidth,
        finalHeight
    );
    // download
    pdf.save("Dashboard_Tilik.pdf");
    dashboard.style.height = "96vh";
    btn.style.display = "block";
    closeBtn.style.display = "block";
}

function tampilData(){

    // urut tanggal terbaru
    allData.sort((a,b)=>
        parseInt(b.register) -
        parseInt(a.register)
    );
    allData.forEach(x=>{
        const tr =
            document.createElement("tr");
        tr.innerHTML = `

        </td>
        <td align="center">
            ${formatTanggal(x.tanggal)}
        </td>
        <td align="left">
            ${x.nama}
        </td>
        <td align="left">
            ${x.unit}
        </td>
        <td align="left">
            ${x.tujuan}
        </td>
        <td align="left">
            ${x.pimpinan}
        </td>
        <td align="center">
            ${formatTanggal(x.tanggalv)}
        <td align="left">
            <span class="pdf-icon"
                onclick="showPDF('${x.fileId}')"
                title="Lihat PDF">
                📄
            </span>
            ${
                x.progres === "P"
                ? `<span class="pdf-icon"
                        onclick="showPDF('${x.fileId}')"
                        title="Sudah Selesai"
                        style="color:red;margin-left:8px;">
                        ❌
                </span>`
                : ""
            }
        </td>
        `;
        list.appendChild(tr);
    });
}

function formatHasil(nilai){
    if(nilai == null || nilai == "")
        return "0,00";
    return parseFloat(nilai)
        .toLocaleString(
            "id-ID",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );
}

function formatTanggal(tgl){
    if(!tgl) return "";
    tgl = tgl.toString();
    // pastikan 8 digit
    if(tgl.length != 8) return tgl;
    const tahun = tgl.substring(0,4);
    const bulan = tgl.substring(4,6);
    const hari = tgl.substring(6,8);
    return hari + "-" + bulan + "-" + tahun;
}


function closeUnitDashboard(){
    document.getElementById(
        "unitDashboardModal"
    ).style.display = "none";
}

async function downloadUnitDashboardPDF(){
    const { jsPDF } = window.jspdf;
    const dashboard =
        document.querySelector(
            ".unit-dashboard-content"
        );
    const btn =
        dashboard.querySelector(
        ".download-dashboard-btn"
        );
        btn.style.display = "none";
    const closeBtn =
        dashboard.querySelector(
            ".close"
        );
        closeBtn.style.display = "none";
    dashboard.style.height = "auto";
    const canvas =
        await html2canvas(dashboard, {
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff",
            windowWidth: dashboard.scrollWidth,
            windowHeight: dashboard.scrollHeight
        });
    const imgData =
        canvas.toDataURL("image/png");
    const pdf =
        new jsPDF({
            orientation:"landscape",
            unit:"mm",
            format:"a4"
        });
    const pageWidth =
        pdf.internal.pageSize.getWidth();
    const pageHeight =
        pdf.internal.pageSize.getHeight();
    const margin = 5;
    const availableWidth =
        pageWidth - (margin * 2);
    const availableHeight =
        pageHeight - (margin * 2);
    const ratio =
        Math.min(
            availableWidth / canvas.width,
            availableHeight / canvas.height
        );
    const finalWidth =
        canvas.width * ratio;
    const finalHeight =
        canvas.height * ratio;
    const x =
        (pageWidth - finalWidth) / 2;
    const y =
        (pageHeight - finalHeight) / 2;
    pdf.addImage(
        imgData,
        "PNG",
        x,
        y,
        finalWidth,
        finalHeight
    );
    pdf.save("Dashboard_Unit.pdf");
    dashboard.style.height = "96vh";
    btn.style.display = "block";
    closeBtn.style.display = "block";
}
