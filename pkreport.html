<body>

<div class="header">
    PERJANJIAN KERJA DAN SURAT KEPUTUSAN KARYAWAN KOPERASI KONSUMEN KARYAWAN TJIWI KIMIA
</div>

<div class="toolbar">
        <div class="pk-box">
            <label>JENIS :</label>

                onchange="filterJenis()">

                id="txtCari"
                placeholder="Cari Noreg / Nama Karyawan">

            </button>
        </div>
</div>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text">
        Loading Data Perjanjian Kerja dan Surat Keputusan !...
    </div>
</div>

<div class="table-container">
    <table>
        <colgroup>
            <col class="col-noreg">
            <col class="col-nama">
            <col class="col-unit">
            <col class="col-nomor">
            <col class="col-tanggal">
            <col class="col-pk">
            <col class="col-mtanggal">
            <col class="col-stanggal">
            <col class="col-lampiran">
        </colgroup>
        <thead>
        <tr>
            <th>Register</th>
            <th>Nama</th>
            <th>Unit</th>
            <th>Nomor</th>
            <th>Tanggal</th>
            <th>Perjanjian</th>
            <th>Berlaku mulai</th>
            <th>Berakhir pada</th>
            <th class="center">Rekaman</th>
        </tr>
        </thead>
        <tbody id="listData"></tbody>
    </table>

<script>


const API_URL = "https://script.google.com/macros/s/AKfycbzfk922-VAgL1GTCbsPhxxHEAPF_nzLOjId2QNoE4KIkVyIZKVv-ti6vdmMpHjfz6cPqA/exec";

let allData = [];
let filteredData = [];

function aturPosisiSticky() {
    const header = document.querySelector(".header");
    const toolbar = document.querySelector(".toolbar");
    const tinggiHeader = header.offsetHeight;
    toolbar.style.top = tinggiHeader + "px";
    document.querySelectorAll("thead th").forEach(th => {
        th.style.top =
            (tinggiHeader + toolbar.offsetHeight) + "px";
    });
}
window.addEventListener("load", aturPosisiSticky);
window.addEventListener("resize", aturPosisiSticky);


// ==================================================
// LOAD DATA DARI GOOGLE SHEETS
// ==================================================

async function loadData() {
    const loading = document.getElementById("loading");
    loading.style.display = "flex";
    try {
        const response = await fetch(API_URL);
        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }
        const result = await response.json();
        allData = Array.isArray(result)
            ? result
            : (Array.isArray(result.data) ? result.data : []);
        if (allData.length === 0) {
            throw new Error("Data Google Sheets kosong.");
        }

        // Isi combo filter
        isiComboJenis();
        isiComboUnit();

        // Tampilkan seluruh data
        terapkanFilter();

        loading.style.display = "none";
    } catch (err) {
        console.error("Kesalahan loadData:", err);
        loading.innerHTML = `
            <div style="color:red;font-weight:bold">
                Gagal mengambil data karyawan.
                <br><br>
                ${err.message}
            </div>
        `;
    }
}


// ==================================================
// ISI COMBOBOX UNIT
// ==================================================

function isiComboUnit() {
    const cmb = document.getElementById("cmbUnit");
    cmb.innerHTML = '<option value="SEMUA">Semua Unit</option>';
    const unit = [
        ...new Set(
            allData.map(x =>
                String(x.unit || x.bagian || "").trim()
            ).filter(x => x !== "")
        )
    ];
    unit.sort();
    unit.forEach(p => {
        const option = document.createElement("option");
        option.value = p;
        option.textContent = p;
        cmb.appendChild(option);
    });
    cmb.value = "SEMUA";
}

// ==================================================
// ISI COMBOBOX JENIS PERJANJIAN
// ==================================================

function isiComboJenis() {
    const cmb = document.getElementById("cmbJenis");
    cmb.innerHTML = '<option value="SEMUA">Semua Perjanjian</option>';
    const jenis = [
        ...new Set(
            allData.map(x =>
                String(x.jenis || "").trim()
            ).filter(x => x !== "")
        )
    ];
    jenis.sort();
    jenis.forEach(p => {
        const option = document.createElement("option");
        option.value = p;
        option.textContent = p;
        cmb.appendChild(option);
    });
    cmb.value = "SEMUA";
}


// ==================================================
// FILTER PERIODE + UNIT + PENCARIAN
// ==================================================

function terapkanFilter() {

    const jenis = document.getElementById("cmbJenis").value;
    const unit = document.getElementById("cmbUnit").value;
    const cari = document.getElementById("txtCari")
        .value.trim().toUpperCase();
    filteredData = allData.filter(x => {
        const jenisData = String(x.jenis || "").trim();
        const unitData = String(x.unit || x.bagian || "").trim();

        // Filter PK
        const sesuaiJenis =
            jenis === "SEMUA" || jenisData === jenis;

        // Filter unit
        const sesuaiUnit =
            unit === "SEMUA" || unitData === unit;

        // Filter pencarian
        const sesuaiCari =
            cari === "" ||
            String(x.noreg || "").toUpperCase().includes(cari) ||
            String(x.nama || "").toUpperCase().includes(cari) ||
            String(x.jabatan || "").toUpperCase().includes(cari);
        return sesuaiJenis && sesuaiUnit && sesuaiCari;
    });
    tampilData(filteredData);
}


// ==================================================
// EVENT FILTER JENIS PERJANJIAN
// ==================================================

function filterJenis() {
    terapkanFilter();
}


// ==================================================
// EVENT FILTER UNIT
// ==================================================

function filterUnit() {
    terapkanFilter();
}


// ==================================================
// PENCARIAN KARYAWAN
// ==================================================

function cariSemua() {
    terapkanFilter();
}


// ==================================================
// MENAMPILKAN DATA KE TABEL
// ==================================================

function tampilData(data) {

    const list = document.getElementById("listData");
    list.innerHTML = "";
    if (data.length === 0) {
        list.innerHTML = `
            <tr>
                <td colspan="6" class="center">
                    Data karyawan tidak ditemukan
                </td>
            </tr>
        `;
        return;
    }

    data.forEach(x => {
        const tr = document.createElement("tr");

        // Kolom Noreg
        const tdNoreg = document.createElement("td");
        tdNoreg.textContent = x.noreg || "";
        tr.appendChild(tdNoreg);

        // Kolom Nama
        const tdNama = document.createElement("td");
        tdNama.textContent = x.nama || "";
        tr.appendChild(tdNama);

        // Kolom Unit
        const tdUnit = document.createElement("td");
        tdUnit.textContent = x.unit || x.bagian || "";
        tr.appendChild(tdUnit);

        // Kolom Nomor
        const tdNomor = document.createElement("td");
        tdNomor.textContent = x.nomor || "";
        tr.appendChild(tdNomor);

        // Kolom Tanggal Dikeluarkan
        const tdTanggal = document.createElement("td");
        tdTanggal.textContent = formatTanggal(x.tanggal);;
        tr.appendChild(tdTanggal);

        // Kolom Jenis Perjanjian
        const tdJenis = document.createElement("td");
        tdJenis.textContent = x.jenis || "";
        tr.appendChild(tdJenis);

        // Kolom Berlaku Mulai
        const tdMulai = document.createElement("td");
        tdMulai.textContent = formatTanggal(x.mtanggal);;
        tr.appendChild(tdMulai);

        // Kolom Berakhir Pada
        const tdBerakhir = document.createElement("td");
        tdBerakhir.textContent = formatTanggal(x.stanggal);;
        tr.appendChild(tdBerakhir);

        // Kolom Icon Job Description
        const tdIcon = document.createElement("td");
        tdIcon.className = "center";

        const icon = document.createElement("span");
        icon.className = "icon-biodata";
        icon.title = "Lihat Perjanjian";
        icon.innerHTML = '<i class="fa-solid fa-file-lines"></i>';
        icon.style.display = "inline-flex";
        icon.style.width = "20px";
        icon.style.height = "20px";
        icon.style.borderRadius = "50%";
        icon.style.alignItems = "center";
        icon.style.justifyContent = "center";
        icon.style.cursor = "pointer";
        icon.addEventListener("click", function() {
            tampilkanPDF(x.fileId);
        });
        tdIcon.appendChild(icon);
        tr.appendChild(tdIcon);
        list.appendChild(tr);
    });
}

// ==================================================
// BUKA HALAMAN JOB DESCRIPTION
// ==================================================

function openJobdesc(fileId) {
    window.open(
        "jobdesc.html?noreg=" + encodeURIComponent(fileId),
        "_blank"
    );

}


// ==================================================
// BUKA PDF DALAM MODAL
// ==================================================

function tampilkanPDF(fileId) {
    if (!fileId) {
        alert("MAAF DOKUMEN LAMPIRAN TIDAK ADA !");
        return;
    }
    const modal = document.getElementById("pdfModal");
    const frame = document.getElementById("pdfFrame");
    // URL PDF Google Drive
    frame.src = "https://drive.google.com/file/d/" + encodeURIComponent(fileId) + "/preview";
    modal.style.display = "block";
}

// ======================================
// MENUTUP PDF
// ======================================

function tutupPDF() {
    document.getElementById("pdfModal").style.display = "none";
    document.getElementById("pdfFrame").src = "";
}

// ======================================
// FORMAT TANGGAL INDONESIA
// ======================================

function formatTanggal(tanggal) {
    if (!tanggal) return "";
    const bulan = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember"
    ];
    let tgl = String(tanggal).trim();

    // Format DD/MM/YYYY
    let bagian = tgl.split("/");
    if (bagian.length === 3) {
        let hari = bagian[0].padStart(2, "0");
        let bln = parseInt(bagian[1], 10);
        let tahun = bagian[2];
        if (bln >= 1 && bln <= 12) {
            return hari + " " + bulan[bln - 1] + " " + tahun;
        }
    }

    // Format YYYY-MM-DD
    bagian = tgl.split("-");
    if (bagian.length === 3 && bagian[0].length === 4) {
        let tahun = bagian[0];
        let bln = parseInt(bagian[1], 10);
        let hari = bagian[2];
        if (bln >= 1 && bln <= 12) {
            return hari + " " + bulan[bln - 1] + " " + tahun;
        }
    }
    return tgl;
}


// ==================================================
// PENCARIAN DENGAN ENTER
// ==================================================

document.getElementById("txtCari")
    .addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            cariSemua();
        }
    });

// ==================================================
// JALANKAN PROGRAM
// ==================================================

loadData();


</script>
