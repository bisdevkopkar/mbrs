<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxXcRqaypV8sUXju3zebBwWKSQ_-qHQAFcykOesQFOdIqsAkfK3TPClgzd5cm-ibPaW/exec";

let allData = [];
let filteredData = [];
let unitData = [];
let barChartObj = null;
let pieOmzetObj = null;
let pieEbitdaObj = null;
let chartEbitdaObj = null;
let chartOmzetObj = null;
let chartKPIObj = null;
let statusFilter = "AKTIF";


function getAngkatan(noreg){

    if(!noreg)
        return "";
    noreg = noreg.toString().trim();

    // minimal 4 digit
    if(noreg.length < 4)
        return "";

    // ambil 2 digit mulai index ke-2
    const yy =
        parseInt(
            noreg.substr(2,2)
        );

    // tentukan abad
    let tahun = 1900 + yy;

    // bila ingin support 2000+
    if(yy < 30){
        tahun = 2000 + yy;
    }
    return tahun;
}


function filterUnit(){
    const unit =
        document.getElementById(
            "cmbUnit"
        ).value;
    filteredData =
        allData.filter(x =>
            x.unit == unit
        );
    tampilData(filteredData);
}

function isiComboUnit(){
    const cmb =
        document.getElementById(
            "cmbUnit"
        );
    cmb.innerHTML =
        `<option value="SEMUA">
            Semua Unit
        </option>`;
    const unit =
        [...new Set(
            allData.map(x => x.unit)
        )];
    unit.sort();
    unit.forEach(p => {
        cmb.innerHTML += `
            <option value="${p}">
                ${p}
            </option>
        `;
    });
    cmb.value = "SEMUA";
}

function ubahStatus(status){
    const chkAktif = document.getElementById("chkAktif");
    const chkKeluar = document.getElementById("chkKeluar");
    if(status == "AKTIF"){
        chkAktif.checked = true;
        chkKeluar.checked = false;
        statusFilter = "AKTIF";
    }else{
        chkAktif.checked = false;
        chkKeluar.checked = true;
        statusFilter = "KELUAR";
    }
    filterUnit();
}

function filterUnit(){
    const unit =document.getElementById("cmbUnit").value;
    const cari = document.getElementById("txtCari").value
        .toUpperCase()
        .trim();
    let dataFilter = allData;
    // FILTER STATUS
    dataFilter =
        dataFilter.filter(x => x.status == statusFilter);
    // FILTER UNIT
    if(unit != "SEMUA"){
        dataFilter = dataFilter.filter(x => x.unit == unit);
    }
    unitData = dataFilter;
    // FILTER NAMA
    filteredData =
        unitData.filter(
            x =>
                cari == "" ||
                x.nama
                    .toUpperCase()
                    .includes(cari)
        );
    tampilData(
        filteredData
    );
}

function cariSemualama(){
    const cari =
        document.getElementById(
            "txtCari"
        ).value
        .trim()
        .toUpperCase();
    filteredData =
        unitData.filter(item =>
            item.nama
                .toUpperCase()
                .includes(cari)
        );
    tampilData(
        filteredData
    );
}


function cariSemua(){
    const cari =
        document.getElementById(
            "txtCari"
        ).value
        .trim()
        .toUpperCase();
    if(cari == ""){
        filterUnit();
        return;
    }
    const hasil =
        allData.filter(item =>
            item.nama &&
            item.nama
                .toUpperCase()
                .includes(cari)
        );
    tampilData(
        hasil
    );
}

async function loadData(){
    try{
        const response =
            await fetch(API_URL);
        allData =
            await response.json();
        document.getElementById("loading")
            .style.display = "none";
        // isi combo tahun
        isiComboUnit();
        // tampilkan data tahun terakhir
        filterUnit();
    }
    catch(err){
        document.getElementById("loading")
            .innerHTML =
            "Gagal load data";
        console.log(err);
    }
}

    document.getElementById("dashboardModal")

    buatGrafik();

function closeDashboard(){
    document.getElementById("dashboardModal")

function buatGrafik(){

    const unit =
        document.getElementById(
            "cmbUnit"
        ).value;

    const dataUnit = unitData;

    // object penampung
    const angkatanData = {};

    // looping data unit
    dataUnit.forEach(item => {
        const tahun =
            getAngkatan(
                item.noreg
            );

        // skip bila kosong
        if(!tahun)
            return;

        // buat counter
        if(!angkatanData[tahun]){
            angkatanData[tahun] = 0;
        }

        // tambah jumlah
        angkatanData[tahun]++;
    });

    // sorting tahun
    const sorted =
        Object.entries(
            angkatanData
        ).sort((a,b)=>
            a[0] - b[0]
        );

    // label chart
    const labels =
        sorted.map(x=>x[0]);

    // jumlah alumni
    const totals =
        sorted.map(x=>x[1]);

    // destroy chart lama
    if(barChartObj)
        barChartObj.destroy();

    // buat chart baru
    barChartObj =
        new Chart(
        document.getElementById(
            "barChart"
        ),
        {
            type:"bar",
            data:{
                labels:labels,
                datasets:[{
                    label:
                        "Jumlah Alumni",
                    data:totals,
                    backgroundColor:
                        "#1565c0"
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                layout:{
                    padding:{
                    top:30
                    }
                },
                plugins:{
                    title:{
                        display:true,
                        text:
                        "PROFIL KARYAWAN - " + unit,
                        font:{
                            family:"Arial",
                            size:22,
                            weight:"bold"
                        },
                        padding:{
                            top:10,
                            bottom:40
                        },
                        color:"#1565c0"
                    },
                    legend:{
                        display:false
                    },
                    datalabels:{
                        anchor:"end",
                        align:"top",
                        color:"#000",
                        font:{
                            size:12,
                            weight:"bold"
                        },
                        formatter:function(value){
                            return value;
                        }
                    },                   
                    scales:{
                        y:{
                            beginAtZero:true
                        }
                    }
                } 
            },
            plugins:[ChartDataLabels]
        }
    );
}

async function downloadDashboardPDF(){
    const { jsPDF } = window.jspdf;
    const dashboard =
        document.querySelector(".dashboard-content");
    const btn =
        dashboard.querySelector(
        ".download-dashboard-btn"
        );
        btn.style.display = "none";
    const closeBtn =
        dashboard.querySelector(
            ".close"
        );
        closeBtn.style.display = "none";
    // capture dashboard
    dashboard.style.height = "auto";
    const canvas =
        await html2canvas(dashboard, {
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff",
            windowWidth: dashboard.scrollWidth,
            windowHeight: dashboard.scrollHeight
        });
    const imgData =
        canvas.toDataURL("image/png");
    // ukuran canvas
    const imgWidth = canvas.width;
    const imgHeight = canvas.height;
    // buat PDF landscape
    const pdf =
        new jsPDF({
            orientation:"landscape",
            unit:"mm",
            format:"a4"
        });
    // ukuran halaman pdf
    const pageWidth =
        pdf.internal.pageSize.getWidth();
    const pageHeight =
        pdf.internal.pageSize.getHeight();
    // margin
    const margin = 5;
    // area tersedia
    const availableWidth =
        pageWidth - (margin * 2);
    const availableHeight =
        pageHeight - (margin * 2);
    // hitung rasio
    const ratio =
        Math.min(
            availableWidth / imgWidth,
            availableHeight / imgHeight
        );
    // ukuran final
    const finalWidth =
        imgWidth * ratio;
    const finalHeight =
        imgHeight * ratio;
    // posisi center
    const x =
        (pageWidth - finalWidth) / 2;
    const y =
        (pageHeight - finalHeight) / 2;
    // masukkan gambar
    pdf.addImage(
        imgData,
        "PNG",
        x,
        y,
        finalWidth,
        finalHeight
    );
    // download
    pdf.save("Dashboard_Tilik.pdf");
    dashboard.style.height = "96vh";
    btn.style.display = "block";
    closeBtn.style.display = "block";
}


function formatTanggal(tgl){
    if(!tgl) return "";
    tgl = tgl.toString();
    // pastikan 8 digit
    if(tgl.length != 8) return tgl;
    const tahun = tgl.substring(0,4);
    const bulan = tgl.substring(4,6);
    const hari = tgl.substring(6,8);
    return hari + "-" + bulan + "-" + tahun;
}

let isDragging = false;
let startX = 0;
let startY = 0;

function lihatGambar(fileId){
    zoomLevel = 1;
    posX = 0;
    posY = 0;
    const img =
        document.getElementById("imgPreview");
    img.src =
        "https://drive.google.com/thumbnail?id=" +
        fileId +
        "&sz=w2000";
    updateTransform();
    document.getElementById(
        "modalGambar"
    ).style.display = "flex";
}

function tutupGambar(){
    document.getElementById(
        "modalGambar"
    ).style.display = "none";
}

function zoomIn(){
    if(zoomLevel < 3){
        zoomLevel += 0.2;
        updateTransform();
    }
}

function zoomOut(){
    if(zoomLevel > 1){
        zoomLevel -= 0.2;
        updateTransform();
    }
}

function resetZoom(){
    zoomLevel = 1;
    posX = 0;
    posY = 0;
    updateTransform();
}

function updateTransform(){
    document.getElementById(
        "imgPreview"
    ).style.transform =
        `translate(${posX}px, ${posY}px)
         scale(${zoomLevel})`;
}

let zoomLevel = 1;

document.addEventListener(
    "DOMContentLoaded",
    function(){
        const img = document.getElementById("imgPreview");
        img.addEventListener("mousedown",
            function(e){
                if(zoomLevel <= 1) return;
                isDragging = true;
                startX = e.clientX - posX;
                startY = e.clientY - posY;
            }
        );
        document.addEventListener("mousemove",
            function(e){
                if(!isDragging) return;
                posX =  e.clientX - startX;
                posY = e.clientY - startY;
                updateTransform();
            }
        );
        document.addEventListener("mouseup",
            function(){
                isDragging = false;
            }
        );
        img.addEventListener("wheel", 
            function(e){
                e.preventDefault();
                if(e.deltaY < 0){
                    zoomLevel += 0.1;
                }else{
                    zoomLevel = Math.max(0.2,zoomLevel - 0.1);
                }
            img.style.transform = "scale(" + zoomLevel + ")";
        });
    }
);


function tampilData(data){
    const list = document.getElementById("listData");
    list.innerHTML = "";
    const showKeluar = (statusFilter == "KELUAR");
    document.getElementById("thTglKeluar").style.display = showKeluar ? "" : "none";
    document.getElementById("thTglKeluar").className = showKeluar ? "th-keluar" : "";
    data.forEach(x => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
        <td>${x.noreg}</td>
        <td>${x.nama}</td>
        <td>${x.alamat}</td>
        <td>${x.tmplahir}</td>
        <td>${formatTanggal(x.tgllahir)}</td>
        <td>${x.hp}</td>
        <td>${x.unit}</td>
        <td>${formatTanggal(x.tglmasuk)}</td>
        ${showKeluar
            ? `<td class="tgl-keluar">
                ${formatTanggal(x.tglkeluar)}
            </td>`
            : ``
        }
        <td>${x.nik}</td>
        <td>${x.bpjskes}</td>

function openBiodata(noreg){

}

function formatHasil(nilai){
    if(nilai == null || nilai == "")
        return "0,00";
    return parseFloat(nilai)
        .toLocaleString(
            "id-ID",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );
}

function toNumber(nilai){
    if(!nilai)
        return 0;
    // ubah ke string
    nilai = nilai.toString();
    // hapus titik ribuan
    nilai = nilai.replace(/\./g, "");
    // ganti koma jadi titik
    nilai = nilai.replace(",", ".");
    // convert number
    return parseFloat(nilai) || 0;
}

function toDecimal(nilai){
    if(!nilai)
        return 0;
    nilai = nilai.toString().trim();
    // hanya ganti koma ke titik
    nilai = nilai.replace(",", ".");
    return parseFloat(nilai) || 0;
}

function formatAngka(nilai){
    if(nilai == null || nilai == "")
        return "0,00";
    return parseFloat(nilai)
        .toLocaleString("id-ID", {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });
}


function toMoney(nilai){
    if(!nilai)
        return 0;
    nilai = nilai.toString().trim();
    // hapus titik ribuan
    nilai =
        nilai.replace(/\./g, "");
    // ubah koma jadi titik
    nilai =
        nilai.replace(",", ".");
    return parseFloat(nilai) || 0;
}


function closeUnitDashboard(){

async function downloadUnitDashboardPDF(){
    const { jsPDF } = window.jspdf;
    const dashboard =
        document.querySelector(
            ".unit-dashboard-content"
        );
    const btn =
        dashboard.querySelector(
        ".download-dashboard-btn"
        );
        btn.style.display = "none";
    const closeBtn =
        dashboard.querySelector(
            ".close"
        );
        closeBtn.style.display = "none";
    dashboard.style.height = "auto";
    const canvas =
        await html2canvas(dashboard, {
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff",
            windowWidth: dashboard.scrollWidth,
            windowHeight: dashboard.scrollHeight
        });
    const imgData =
        canvas.toDataURL("image/png");
    const pdf =
        new jsPDF({
            orientation:"landscape",
            unit:"mm",
            format:"a4"
        });
    const pageWidth =
        pdf.internal.pageSize.getWidth();
    const pageHeight =
        pdf.internal.pageSize.getHeight();
    const margin = 5;
    const availableWidth =
        pageWidth - (margin * 2);
    const availableHeight =
        pageHeight - (margin * 2);
    const ratio =
        Math.min(
            availableWidth / canvas.width,
            availableHeight / canvas.height
        );
    const finalWidth =
        canvas.width * ratio;
    const finalHeight =
        canvas.height * ratio;
    const x =
        (pageWidth - finalWidth) / 2;
    const y =
        (pageHeight - finalHeight) / 2;
    pdf.addImage(
        imgData,
        "PNG",
        x,
        y,
        finalWidth,
        finalHeight
    );
    pdf.save("Dashboard_Unit.pdf");
    dashboard.style.height = "96vh";
    btn.style.display = "block";
    closeBtn.style.display = "block";
}
